<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Erick Loor's Class Materials</title>
<style>
  :root {
    --navy: #102040;
    --red: #961E26;
    --bg: #F5F6F8;
    --card: #FFFFFF;
    --border: #DADFE5;
    --muted: #6B7280;
    --ink: #1A1A1A;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 24px 16px 60px;
    line-height: 1.5;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  header {
    background: var(--navy);
    color: #fff;
    border-radius: 12px;
    padding: 26px 26px 24px;
    margin-bottom: 28px;
  }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 32px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }
  header p {
    margin: 0;
    font-size: 14px;
    color: #C9D2E0;
    max-width: 52ch;
  }

  .group { margin-bottom: 34px; }
  .group-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 2px solid var(--navy);
    padding-bottom: 7px;
    margin-bottom: 12px;
  }
  .group-head h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 21px;
    color: var(--navy);
    margin: 0;
  }
  .count {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .list { list-style: none; margin: 0; padding: 0; }
  .list li + li { margin-top: 8px; }

  .item {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: 8px;
    padding: 13px 16px;
    text-decoration: none;
    color: inherit;
    transition: border-left-color .15s, background .15s;
  }
  .item:hover { border-left-color: var(--red); background: #FCFCFD; }
  .item:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 2px;
  }
  .item-title {
    display: block;
    font-size: 16px;
    font-weight: 600;
    color: var(--navy);
  }
  .item-note {
    display: block;
    font-size: 13.5px;
    color: var(--muted);
    margin-top: 3px;
    max-width: 62ch;
  }
  .tags { margin-top: 9px; }
  .tag {
    display: inline-block;
    font-size: 11.5px;
    color: var(--navy);
    background: #EDF0F5;
    border-radius: 4px;
    padding: 2px 7px;
    margin-right: 5px;
  }

  .empty {
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 16px;
    font-size: 13.5px;
    color: var(--muted);
  }

  footer {
    margin-top: 34px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media (max-width: 480px) {
    header { padding: 22px 20px; }
    header h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Erick Loor's Class Materials</h1>
    <p>Games and practice activities for our English classes. Pick your group below and open any
       activity — it runs in the browser, on a phone or a laptop, with nothing to install.</p>
  </header>

  <main id="groups"></main>

  <footer>
    Made for classroom use. If an activity does not open, refresh the page or try another browser.
  </footer>

</div>

<script>
/* ============================================================
   LISTA DE ACTIVIDADES  —  esto es lo único que editas.

   Para agregar un juego:
     1. Sube el .html a la carpeta games/
     2. Copia un bloque { ... } dentro del grupo que corresponda
     3. Cambia title, file, note y tags

   Para agregar un grupo nuevo, copia un bloque completo
   { name: "...", items: [ ... ] } y ponlo en la lista.

   Si un grupo todavía no tiene juegos, deja items: []
   y la página muestra un aviso en su lugar.
   ============================================================ */

const GROUPS = [
  {
    name: "Connectivity Level 2",
    items: [
      {
        title: "Twenty-One",
        file: "games/unit1-gerunds-infinitives-twenty-one.html",
        note: "Board game in pairs. Move along the board and build questions with the verb you land on, using a gerund or an infinitive.",
        tags: ["Unit 1", "Grammar", "Speaking"]
      }
    ]
  }
];

/* ==== De aquí para abajo no hace falta tocar nada ==== */

function makeTag(text) {
  const el = document.createElement("span");
  el.className = "tag";
  el.textContent = text;
  return el;
}

function makeItem(item) {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "item";
  a.href = item.file;

  const title = document.createElement("span");
  title.className = "item-title";
  title.textContent = item.title;
  a.appendChild(title);

  if (item.note) {
    const note = document.createElement("span");
    note.className = "item-note";
    note.textContent = item.note;
    a.appendChild(note);
  }

  if (item.tags && item.tags.length) {
    const tags = document.createElement("div");
    tags.className = "tags";
    item.tags.forEach(t => tags.appendChild(makeTag(t)));
    a.appendChild(tags);
  }

  li.appendChild(a);
  return li;
}

function makeGroup(group) {
  const section = document.createElement("section");
  section.className = "group";

  const head = document.createElement("div");
  head.className = "group-head";

  const h2 = document.createElement("h2");
  h2.textContent = group.name;
  head.appendChild(h2);

  const n = group.items ? group.items.length : 0;
  const count = document.createElement("span");
  count.className = "count";
  count.textContent = n === 1 ? "1 activity" : n + " activities";
  head.appendChild(count);

  section.appendChild(head);

  if (!n) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Nothing here yet — activities for this group are on the way.";
    section.appendChild(empty);
    return section;
  }

  const ul = document.createElement("ul");
  ul.className = "list";
  group.items.forEach(item => ul.appendChild(makeItem(item)));
  section.appendChild(ul);
  return section;
}

const container = document.getElementById("groups");
GROUPS.forEach(g => container.appendChild(makeGroup(g)));
</script>
</body>
</html>
